<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없어요 | 취업이직연구소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/*__SHARED_CSS__*/
/* 404: 없는 주소로 들어온 사람을 주요 메뉴로 돌려보낸다 (2026-11-04 홍보 전 점검) */
.nf { max-width: 640px; margin: 0 auto; padding: 56px 20px 40px; }
.nf .code { font-family: Archivo, sans-serif; font-weight: 900; font-size: 64px; line-height: 1; color: var(--black); }
.nf h1 { margin-top: 14px; font-size: clamp(24px, 6vw, 32px); font-weight: 900; line-height: 1.3; }
.nf p { margin-top: 12px; font-size: 15px; line-height: 1.7; color: var(--fg-soft); }
.nf .go { margin-top: 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.nf .go a { display: block; padding: 16px; border: 1.5px solid var(--line); border-radius: 14px; text-decoration: none; color: var(--black); font-weight: 700; font-size: 15px; }
.nf .go a small { display: block; margin-top: 4px; font-weight: 500; font-size: 12.5px; color: var(--muted); }
.nf .go a.main { grid-column: 1 / -1; background: #c6ff3d; border-color: #c6ff3d; color: #0b0b0b; }
.nf .go a.main small { color: #333; }
</style>
</head>
<body>
/*__NAV__*/
<main class="nf">
  <div class="code">404</div>
  <h1>찾는 페이지가 없어요.</h1>
  <p>주소가 바뀌었거나 잘못 입력된 것 같아요. 아래에서 바로 이어서 보세요.</p>
  <div class="go">
    <a class="main" href="/">취업이직연구소 첫 화면 <small>회사 판단 · 연봉 · 직무 · 뉴스</small></a>
    <a href="/jobs/">직무 사전 <small>그 직무의 진짜 모습</small></a>
    <a href="/company/">회사 판단 <small>그 회사, 가도 될까요?</small></a>
    <a href="/salary/">연봉 연구소 <small>직급별 연봉 추정</small></a>
    <a href="/fit/">1분 직무 진단 <small>나에게 맞는 직무</small></a>
    <a href="/apply/">무료 상담 <small>컨설턴트와 이야기하기</small></a>
  </div>
</main>
/*__FOOTER__*/
/*__FAB__*/
</body>
</html>
