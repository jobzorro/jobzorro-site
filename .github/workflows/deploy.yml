# 취업조로 사이트(직무사전 · 취업뉴스 · 함께하기 · 상담 신청)를 GitHub Pages에 올린다.
#   push(main) → 즉시 / 매일 아침 09:20 KST → 뉴스 페이지 갱신 반영 / Actions 탭 "Run workflow" → 수동
# 취업뉴스 탭은 career-briefing 저장소가 배포한 페이지를 내려받아 공용 탭만 끼워 넣는다.

name: deploy-site

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 0 * * *"      # UTC 00:20 = 한국시간 09:20 (뉴스 브리핑이 07:52~08:52 KST에 갱신된 뒤)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-site
  cancel-in-progress: true

env:
  NEWS_URL: https://jobzorro.github.io/career-briefing/
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치 (프로필 사진 축소용 Pillow)
        run: pip install pillow

      - name: 사이트 빌드
        run: python build.py

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
